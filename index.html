<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mektup 💌</title>
    <link rel="icon" type="image/png" href="pngs/mahmut.png">
    
    <!-- Türkçe destekli tatlı font: Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- EmailJS Library -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    
    <style>
        /* Genel Tasarım */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: 'Nunito', sans-serif; /* Yeni fontumuz */
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: #444;
        }

        #app-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* Sayfa Geçişleri (Views) */
        .view {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            animation: fadeIn 0.4s ease;
            text-align: center;
        }

        .active-view {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Yazılar ve Butonlar */
        h2 { font-size: 28px; margin-bottom: 10px; font-weight: 700; color: #ff6b6b; }
        p { font-size: 18px; margin-top: 0; color: #666; font-weight: 600; }

        input, textarea {
            width: 100%;
            padding: 16px;
            margin: 15px 0;
            border: 2px solid #ffe3e3;
            border-radius: 16px;
            box-sizing: border-box;
            font-size: 18px;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            background: #fffafa;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-color: #ff6b6b;
        }

        button {
            width: 100%;
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 20px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        button:active { transform: scale(0.98); background-color: #ff5252; }
        button:disabled { background-color: #ffb8b8; cursor: not-allowed; }

        /* Sol Üst Geri Butonu */
        .top-back-btn {
            background: transparent;
            color: #ff6b6b;
            width: auto;
            padding: 5px 10px;
            font-size: 18px;
            align-self: flex-start; 
            margin-bottom: 20px;
        }
        .top-back-btn:hover { background: #fffafa; }

        /* Çocuk Seçim Ekranı */
        .children-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .child-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            background: #fff;
            padding: 15px;
            border-radius: 20px;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .child-card:active { transform: scale(0.95); }
        .child-card:hover { border-color: #ffe3e3; background: #fffafa; }
        
        .child-img-wrapper {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #f1f3f5;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .child-img-wrapper img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        .child-name {
            font-size: 19px;
            font-weight: 700;
            color: #555;
        }

        /* Mesaj Balonu */
        .speech-bubble {
            position: relative;
            background: #fffafa;
            border: 2px solid #ffe3e3;
            border-radius: 24px;
            padding: 25px 20px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 30px;
            width: 100%;
            box-sizing: border-box;
            line-height: 1.4;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            width: 0;
            height: 0;
            border: 15px solid transparent;
            border-top-color: #fffafa;
            border-bottom: 0;
            margin-left: -15px;
            z-index: 2;
        }
        
        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -18px;
            left: 50%;
            width: 0;
            height: 0;
            border: 18px solid transparent;
            border-top-color: #ffe3e3;
            border-bottom: 0;
            margin-left: -18px;
            z-index: 1;
        }

        #selected-child-img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            margin-bottom: 25px;
        }

        .input-area { width: 100%; }
        .back-btn { background-color: #f1f3f5; color: #666; margin-top: 15px;}
        .back-btn:active { background-color: #e9ecef; }
    </style>
</head>
<body>

<div id="app-container">
    <!-- EKRAN 1: GİRİŞ -->
    <div id="login-view" class="view active-view">
        <h2>Hoşgeldin! 💖</h2>
        <p>Lütfen şifreyi gir:</p>
        <input type="password" id="password-input" placeholder="Şifre..." />
        <button onclick="handleLogin()">Giriş Yap</button>
    </div>

    <!-- EKRAN 2: ÇOCUK SEÇİMİ -->
    <div id="select-view" class="view">
        <h2>Kimi seçmek istersin?</h2>
        <div class="children-grid">
            <div class="child-card" onclick="selectChild('mahmut', 'pngs/mahmut.png')">
                <div class="child-img-wrapper"><img src="pngs/mahmut.png"></div>
                <span class="child-name">mahmut</span>
            </div>
            <div class="child-card" onclick="selectChild('fındık', 'pngs/fındık.png')">
                <div class="child-img-wrapper"><img src="pngs/fındık.png"></div>
                <span class="child-name">fındık</span>
            </div>
            <div class="child-card" onclick="selectChild('vakvak', 'pngs/vakvak.png')">
                <div class="child-img-wrapper"><img src="pngs/vakvak.png"></div>
                <span class="child-name">vakvak</span>
            </div>
            <div class="child-card" onclick="selectChild('bobo', 'pngs/bobo.png')">
                <div class="child-img-wrapper"><img src="pngs/bobo.png"></div>
                <span class="child-name">bobo</span>
            </div>
            <div class="child-card" onclick="selectChild('sinco', 'pngs/sinco.png')">
                <div class="child-img-wrapper"><img src="pngs/sinco.png"></div>
                <span class="child-name">sinco</span>
            </div>
        </div>
    </div>

    <!-- EKRAN 3: MESAJ GÖNDERME -->
    <div id="message-view" class="view">
        <!-- SOL ÜST GERİ BUTONU -->
        <button class="top-back-btn" onclick="goBackToSelect()">⬅ Geri</button>

        <div class="speech-bubble" id="bubble-text">
            Hey anne! Babamı çağırmamı mı istiyorsun? Ona ne söyleyeyim çağırırken?
        </div>
        
        <img id="selected-child-img" src="" alt="Seçilen Çocuk" />

        <div class="input-area" id="input-section">
            <textarea id="user-message" placeholder="Mesajını buraya yaz..." rows="3"></textarea>
            <button id="send-btn" onclick="sendMessage()">Babaya Gönder!</button>
        </div>

        <div class="input-area" id="success-section" style="display: none;">
            <button class="back-btn" onclick="resetApp()">Başka mesaj gönder</button>
        </div>
    </div>
</div>

<script>
    // --- AYARLAR ---
    const EXPECTED_PASSWORD = "aşk";
    
    // Public Key (Senin verdiğin ID)
    emailjs.init("OAJ1DR8aB5ZLjESbo"); 
    
    let currentChildName = "";
    let currentChildImgPath = ""; 

    function switchView(viewId) {
        document.querySelectorAll('.view').forEach(el => el.classList.remove('active-view'));
        document.getElementById(viewId).classList.add('active-view');
    }

    function handleLogin() {
        const pass = document.getElementById('password-input').value.toLowerCase();
        if (pass === EXPECTED_PASSWORD.toLowerCase()) {
            switchView('select-view');
        } else {
            alert('Yanlış şifre! Tekrar dene :)');
        }
    }

    document.getElementById('password-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') handleLogin();
    });

    function selectChild(name, imgSrc) {
        currentChildName = name;
        currentChildImgPath = imgSrc; 
        document.getElementById('selected-child-img').src = imgSrc;
        switchView('message-view');
    }

    function goBackToSelect() {
        switchView('select-view');
    }

    function sendMessage() {
        const messageBox = document.getElementById('user-message');
        const sendBtn = document.getElementById('send-btn');
        const message = messageBox.value.trim();

        if (!message) {
            alert("Lütfen bir mesaj yaz!");
            return;
        }

        sendBtn.innerText = "Gönderiliyor...";
        sendBtn.disabled = true;

        const absoluteImgUrl = new URL(currentChildImgPath, window.location.href).href;

        // BURAYA SERVICE VE TEMPLATE ID'NI YAZMALISIN
        emailjs.send("service_nxvk9zj", "template_c4jgixs", {
            message: message,
            child_name: currentChildName,
            child_image: absoluteImgUrl 
        }).then(
            function (response) {
                document.getElementById('bubble-text').innerText = "Tamam annecim hemen çağırıyorum babamı :)";
                document.getElementById('input-section').style.display = 'none';
                document.getElementById('success-section').style.display = 'block';
                document.querySelector('.top-back-btn').style.display = 'none'; 
            },
            function (error) {
                console.error("HATA", error);
                alert("Mesaj gönderilemedi, lütfen tekrar dene.");
                sendBtn.innerText = "Babaya Gönder!";
                sendBtn.disabled = false;
            }
        );
    }

    function resetApp() {
        document.getElementById('user-message').value = "";
        document.getElementById('bubble-text').innerText = "Hey anne! Babamı çağırmamı mı istiyorsun? Ona ne söyleyeyim çağırırken?";
        document.getElementById('input-section').style.display = 'block';
        document.getElementById('success-section').style.display = 'none';
        document.getElementById('send-btn').innerText = "Babaya Gönder!";
        document.getElementById('send-btn').disabled = false;
        document.querySelector('.top-back-btn').style.display = 'block';
        switchView('select-view');
    }
</script>

</body>
</html>
